[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-bert"
version = "0.1.0"
description = "Protein homolog detection via tetrapeptide Jaccard + ESM2 semantic scoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
semantic = [
    "torch>=2.0",
    "transformers>=4.40",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
biobert = "biobert.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biobert*"]
