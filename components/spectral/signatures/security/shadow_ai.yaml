id: SHA-005
name: shadow_ai_workspace_config
version: "1.0"
category: security/shadow-ai
model_family: Generic/ShadowAI
confidence: medium
description: Workspace or dotfile configurations revealing personal AI tool setup that bypasses enterprise access controls
technique: Shadow AI discovery
match_all: false
indicators:
  - type: file_path
    pattern: '*/.config/chatgpt*'
  - type: file_path
    pattern: '*/.config/claude*'
  - type: regex
    pattern: '"openaiKey":\s*"sk-'
  - type: regex
    pattern: '"anthropicApiKey":\s*"sk-ant-'
  - type: regex
    pattern: 'OPENAI_BASE_URL.*openai\.com'
tags: [shadow-ai, dotfile, config, personal, unsanctioned]
