id: AGT-001
name: claude_code_project_dir
version: "1.0"
category: agentic/filesystem
model_family: Anthropic/Claude
confidence: high
description: Claude Code agent session and project configuration artifacts on the filesystem
technique: Autonomous agent deployment
match_all: false
indicators:
  - type: file_path
    pattern: '.claude/settings.json'
  - type: file_path
    pattern: '.claude/settings.local.json'
  - type: file_path
    pattern: '.claude/todos.json'
  - type: file_path
    pattern: 'CLAUDE.md'
tags: [claude, agent, filesystem, session]
---
id: AGT-002
name: claude_agent_session_transcript
version: "1.1"
category: agentic/filesystem
model_family: Anthropic/Claude
confidence: high
description: Claude Code session transcript and memory files
technique: Autonomous agent persistence
match_all: false
indicators:
  - type: file_path
    pattern: '.claude/projects/'
  - type: file_path
    pattern: 'memory/MEMORY.md'
  - type: file_path
    pattern: '/claude/transcripts/'
  # Transcript-specific: UUID + role co-occurrence. Avoids FP on code that constructs
  # OpenAI-compatible message arrays (same role/assistant JSON, no UUID context).
  - type: regex
    pattern: '"uuid":\s*"[0-9a-f-]{8}-[0-9a-f-]{4}-[0-9a-f-]{4}-[0-9a-f-]{4}-[0-9a-f-]{12}"'
  - type: regex
    pattern: '"conversation_id":\s*"[0-9a-f-]{36}"'
tags: [claude, agent, persistence, memory]
---
id: AGT-003
name: claude_agent_tool_output
version: "1.0"
category: agentic/logs
model_family: Anthropic/Claude
confidence: medium
description: Claude Code tool call output patterns in log files
technique: Autonomous agent activity
match_all: false
indicators:
  - type: regex
    pattern: '<function_calls>\s*<invoke name='
  - type: regex
    pattern: 'Tool result for'
  - type: string
    pattern: '<function_calls>'
tags: [claude, agent, tool-use, logs]
