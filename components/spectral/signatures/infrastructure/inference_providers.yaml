id: GRQ-001
name: groq_api_headers
version: "1.0"
category: infrastructure/headers
model_family: Groq/Generic
confidence: high
description: Groq inference API endpoint and header patterns in HTTP logs or captured traffic
technique: AI API usage
match_all: false
indicators:
  - type: string
    pattern: 'api.groq.com'
  - type: regex
    pattern: 'x-groq-id:\s*req_'
