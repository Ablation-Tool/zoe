id: CON-001
name: gpt_phishing_closing_phrases
version: "1.0"
category: content/email
model_family: OpenAI/GPT
confidence: low
description: Closing phrase patterns statistically overrepresented in GPT-generated phishing emails
technique: AI-generated phishing / social engineering
match_all: false
indicators:
  - type: regex
    pattern: 'Please don.t hesitate to (reach out|contact us|get in touch)'
  - type: regex
    pattern: 'I hope this (email|message) finds you well'
  - type: regex
    pattern: 'Best regards,?\s*\n[A-Z][a-z]+'
  - type: regex
    pattern: 'If you have any (questions|concerns|issues), (please |feel free to )?(contact|reach out)'
tags: [phishing, gpt, email, social-engineering, content]
