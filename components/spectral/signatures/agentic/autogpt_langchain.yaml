id: AGT-021
name: langchain_serialized_chain
version: "1.0"
category: agentic/config
model_family: LangChain/Generic
confidence: medium
description: LangChain serialized chain or agent configuration
technique: AI framework deployment
match_all: false
indicators:
  - type: string
    pattern: '"_type": "llm_chain"'
  - type: string
