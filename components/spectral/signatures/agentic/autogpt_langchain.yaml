id: AGT-011
name: autogpt_memory_backend
version: "1.0"
category: agentic/filesystem
model_family: OpenAI/AutoGPT
confidence: medium
description: AutoGPT memory backend files (local JSON, SQLite, or Redis artifacts)
technique: Autonomous agent persistence
match_all: false
indicators:
  - type: regex
    pattern: '"auto_gpt_memory"'
  - type: regex
    pattern: '"next_action":\s*\{'
  - type: regex
    pattern: '"task_complete":\s*(true|false)'
  - type: string
    pattern: 'auto_gpt_workspace'
tags: [autogpt, memory, persistence]
