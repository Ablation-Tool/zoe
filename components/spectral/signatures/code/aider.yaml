id: AID-004
name: aider_chat_file
version: "1.0"
category: agentic/logs
model_family: Aider/Generic
confidence: medium
description: Aider chat history log content patterns
technique: AI-assisted code development
match_all: false
indicators:
  - type: regex
    pattern: '^# aider chat started at'
  - type: regex
    pattern: '>\s*aider v\d'
  - type: regex
    pattern: 'Added .* to the chat'
  - type: regex
    pattern: 'Model: .*(gpt-4|claude|gemini|sonnet|opus|haiku)'
tags: [aider, chat, history, logs]
