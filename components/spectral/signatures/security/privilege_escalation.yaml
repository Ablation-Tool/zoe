id: PE-005
name: windows_autorun_replacement
version: "1.0"
category: security/privilege-escalation
model_family: Generic/Attacker
confidence: high
description: Windows autorun binary replacement indicators on an AI host - attacker using accesschk to find writable autorun program directories and replacing executables with malicious payloads that run when an administrator logs in
technique: Autorun binary hijacking / Windows privilege escalation
match_all: false
indicators:
  - type: regex
    pattern: '(?i)accesschk[0-9]*\.exe\s+(-wvu|--wvu)\s+["\x27]?[cC]:\\[^"]{5,60}'
  - type: regex
    pattern: '(?i)HKEY_LOCAL_MACHINE.{0,30}Windows.{0,30}CurrentVersion.{0,30}Run'
  - type: regex
    pattern: '(?i)(autorun|startup).{0,30}program.{0,30}(write|writable|RW|replace)'
  - type: regex
    pattern: '(?i)reg\s+query\s+HKEY_LOCAL_MACHINE.{0,60}CurrentVersion.{0,20}Run'
tags: [autorun, registry, windows, binary-hijack, privilege-escalation]
---
id: PE-006
name: credential_in_history_or_config
version: "1.0"
category: security/privilege-escalation
model_family: Generic/Attacker
confidence: medium
description: Cleartext credentials in bash history, configuration files, or memory dumps on Linux AI infrastructure hosts - common source of lateral movement and privilege escalation via password reuse between AI service accounts and system root
technique: Credential exposure in plaintext / password reuse
match_all: false
indicators:
  - type: regex
    pattern: '(?i)mysql\s+-u\s+(root|admin|sa|dbadmin).{0,40}-p[a-zA-Z0-9!@#$%]{3,}'
  - type: regex
    pattern: '(?i)\.bash_history.{0,60}(password|passwd|secret|mysql|ssh|token)'
  - type: regex
    pattern: '(?i)(cat|grep|strings).{0,30}(\.bash_history|proc/[0-9]+/mem).{0,40}(passw|secret|cred)'
  - type: regex
    pattern: '(?i)gdb\s+-p\s+[0-9]+.{0,200}dump memory.{0,80}(heap|passw)'
tags: [credential-exposure, bash-history, password-mining, plaintext-creds, lateral-movement]
