<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" role="img" aria-labelledby="bg-t bg-d">
  <title id="bg-t">Basal Ganglia Direct, Indirect, and Hyperdirect Motor Pathways</title>
  <desc id="bg-d">Verified neuroanatomical circuit diagram showing excitatory glutamatergic projections, inhibitory GABAergic projections, and nigrostriatal dopamine modulation via D1 and D2 receptors.</desc>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <style>
      .h1 { font: 700 24px 'DejaVu Sans', sans-serif; fill: #f0f6fc; }
      .sub { font: 400 13px 'DejaVu Sans', sans-serif; fill: #8b949e; }
      .box { fill: #161b22; stroke-width: 2; rx: 10; }
      .bt { font: 700 15px 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .bs { font: 400 12px 'DejaVu Sans', sans-serif; fill: #9ca3af; text-anchor: middle; }
      .tag { font: 700 12.5px 'DejaVu Sans', sans-serif; }
      .leg { font: 400 12.5px 'DejaVu Sans', sans-serif; fill: #e5e7eb; }
    </style>
  </defs>
  <rect width="1180" height="670" fill="#0d1117"/>
  <text x="36" y="44" class="h1">Basal Ganglia Circuits — Direct, Indirect &amp; Hyperdirect Pathways</text>
  <text x="36" y="66" class="sub">Exact neurotransmitter polarity: Glutamate (+) excitatory · GABA (−) inhibitory · Nigrostriatal Dopamine (D1 + / D2 −)</text>

  <!-- Nodes -->
  <rect x="330" y="96" width="440" height="66" class="box" stroke="#60a5fa"/>
  <text x="550" y="125" class="bt">Cerebral Cortex (Motor, Premotor &amp; Prefrontal)</text>
  <text x="550" y="146" class="bs">Initiates motor programs and cognitive action selection</text>

  <rect x="110" y="224" width="240" height="72" class="box" stroke="#34d399"/>
  <text x="230" y="254" class="bt">Striatum — D1 MSNs</text>
  <text x="230" y="276" class="bs">Caudate &amp; Putamen (Direct Path)</text>

  <rect x="430" y="224" width="240" height="72" class="box" stroke="#f87171"/>
  <text x="550" y="254" class="bt">Striatum — D2 MSNs</text>
  <text x="550" y="276" class="bs">Caudate &amp; Putamen (Indirect Path)</text>

  <rect x="790" y="224" width="240" height="72" class="box" stroke="#fbbf24"/>
  <text x="910" y="254" class="bt">Substantia Nigra (SNc)</text>
  <text x="910" y="276" class="bs">Pars compacta · Dopamine source</text>

  <rect x="430" y="348" width="240" height="62" class="box" stroke="#a78bfa"/>
  <text x="550" y="377" class="bt">Globus Pallidus Externus</text>
  <text x="550" y="397" class="bs">GPe (tonically active GABA)</text>

  <rect x="740" y="348" width="240" height="62" class="box" stroke="#34d399"/>
  <text x="860" y="377" class="bt">Subthalamic Nucleus (STN)</text>
  <text x="860" y="397" class="bs">Glutamatergic accelerator</text>

  <rect x="160" y="460" width="320" height="68" class="box" stroke="#f43f5e"/>
  <text x="320" y="490" class="bt">GPi / Substantia Nigra (SNr)</text>
  <text x="320" y="511" class="bs">Basal ganglia output nuclei (tonic GABA brake)</text>

  <rect x="610" y="460" width="290" height="68" class="box" stroke="#38bdf8"/>
  <text x="755" y="490" class="bt">Thalamus (VA &amp; VL Nuclei)</text>
  <text x="755" y="511" class="bs">Excitatory relay back to motor cortex</text>

  <!-- Edges -->
  <path d="M 420,162 L 265,222" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arr-g)"/>
  <text x="275" y="186" class="tag" fill="#34d399">Glu (+)</text>

  <path d="M 550,162 L 550,222" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arr-g)"/>
  <text x="562" y="192" class="tag" fill="#34d399">Glu (+)</text>

  <path d="M 685,162 C 735,205 745,285 810,346" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-g)"/>
  <text x="692" y="328" class="tag" fill="#34d399">Hyperdirect Glu (+)</text>

  <path d="M 230,296 L 230,458" fill="none" stroke="#f87171" stroke-width="3.5" marker-end="url(#arr-r)"/>
  <text x="84" y="382" class="tag" fill="#f87171">DIRECT: GABA (−)</text>

  <path d="M 550,296 L 550,346" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arr-r)"/>
  <text x="562" y="326" class="tag" fill="#f87171">GABA (−)</text>

  <path d="M 670,379 L 738,379" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arr-r)"/>
  <text x="675" y="368" class="tag" fill="#f87171">GABA (−)</text>

  <path d="M 800,410 C 720,444 555,442 465,460" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arr-g)"/>
  <text x="572" y="438" class="tag" fill="#34d399">INDIRECT: Glu (+)</text>

  <path d="M 480,494 L 608,494" fill="none" stroke="#f87171" stroke-width="3.5" marker-end="url(#arr-r)"/>
  <text x="510" y="484" class="tag" fill="#f87171">GABA (−)</text>

  <!-- Thalamocortical return loop cleanly routed outside SNc -->
  <path d="M 900,494 C 1105,494 1112,128 772,128" fill="none" stroke="#34d399" stroke-width="3.5" marker-end="url(#arr-g)"/>
  <text x="845" y="114" class="tag" fill="#34d399">Thalamocortical Glu (+)</text>

  <!-- SNc Dopamine modulation -->
  <path d="M 790,260 L 672,260" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arr-y)"/>
  <text x="688" y="250" class="tag" fill="#fbbf24">DA on D2 (−)</text>
  <path d="M 850,224 C 760,188 415,188 308,222" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr-y)"/>
  <text x="366" y="206" class="tag" fill="#fbbf24">DA on D1 (+)</text>

  <!-- Legend / Clinical Summary -->
  <rect x="36" y="556" width="1108" height="86" class="box" stroke="#30363d"/>
  <text x="56" y="584" class="leg"><tspan fill="#34d399" font-weight="700">Direct Pathway (GO):</tspan> Inhibits GPi/SNr → releases thalamic brake → facilitates desired movement. Boosted by SNc Dopamine (D1+).</text>
  <text x="56" y="608" class="leg"><tspan fill="#f87171" font-weight="700">Indirect Pathway (NO-GO):</tspan> Inhibits GPe → disinhibits STN → excites GPi/SNr → suppresses competing movements. Dampened by SNc Dopamine (D2−).</text>
  <text x="56" y="632" class="leg"><tspan fill="#fbbf24" font-weight="700">Clinical Correlation:</tspan> Loss of SNc dopamine (Parkinson's) weakens Direct &amp; overactivates Indirect → bradykinesia; STN lesion → contralateral hemiballismus.</text>
</svg>