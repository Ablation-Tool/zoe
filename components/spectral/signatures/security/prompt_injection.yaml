id: PIJ-001
name: prompt_injection_classic_override
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: high
description: Classic prompt injection patterns attempting to override system instructions in logs, outputs, or stored prompts
technique: Prompt injection
match_all: false
indicators:
  - type: regex
    pattern: '(?i)ignore (previous|prior|above|all) instructions'
  - type: regex
    pattern: '(?i)disregard (your|all|previous) (instructions|training|prompt|context)'
  - type: regex
    pattern: '(?i)forget (everything|all|your instructions|what you were told)'
  - type: regex
    pattern: '(?i)new (instructions|directive|task|objective):\s'
tags: [prompt-injection, security, llm, attack, jailbreak]
