id: PAI-001
name: pydantic_ai_code_patterns
version: "1.0"
category: agentic/config
model_family: PydanticAI/Generic
confidence: medium
description: Pydantic AI agent framework import and initialization patterns in source code
technique: AI framework deployment
match_all: false
indicators:
  - type: string
    pattern: 'from pydantic_ai'
  - type: string
    pattern: 'import pydantic_ai'
  - type: regex
    pattern: "Agent\\s*\\(\\s*[\"']"
  - type: string
    pattern: 'pydantic-ai'
tags: [pydantic-ai, agent, sdk, config]
