[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github-tos-audit"
version = "0.2.0"
description = "Audit a git repository for GitHub Terms of Service and Acceptable Use Policy risks, with every finding mapped to a verbatim clause."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["github", "terms-of-service", "compliance", "audit", "secrets"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
github-tos-audit = "github_tos_audit:main"
tos-gem = "tos_gem.__main__:main"

[project.urls]
Homepage = "https://github.com/Ablation-Tool/github-tos-audit"
Issues = "https://github.com/Ablation-Tool/github-tos-audit/issues"

[tool.setuptools]
py-modules = ["github_tos_audit"]
packages = ["tos_gem"]

[tool.setuptools.package-data]
tos_gem = ["snapshot/*.txt", "snapshot/meta.json"]
