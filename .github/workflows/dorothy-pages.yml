name: Deploy Dorothy Brain Observatory to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "dorothy-brain-observatory/**"
      - ".github/workflows/dorothy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "dorothy-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dorothy-brain-observatory
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Dorothy Brain Observatory artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dorothy-brain-observatory"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
