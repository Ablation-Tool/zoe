[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kloster-fieldwork"
version = "0.1.0"
description = "Search Nicholas Kloster's security work and generate an evidence-linked resume."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fieldwork = "fieldwork.cli:main"

[tool.setuptools.packages.find]
include = ["fieldwork*"]

[tool.setuptools.package-data]
fieldwork = ["data/*.json"]
