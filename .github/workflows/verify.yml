name: Zoe Monorepo Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and editable packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ./guiai-lab -e ./components/agent-logging-system

      - name: Run One-System Autonomy Verification
        env:
          ZOE_ROOT: ${{ github.workspace }}
        run: |
          python scripts/verify-one-system.py

      - name: Cache Allen Mouse CCFv3 reference meshes (Dorothy)
        uses: actions/cache@v4
        with:
          path: ~/.cache/dorothy/ccf_2017
          key: dorothy-ccf-2017-v1

      - name: Fetch Allen Mouse CCFv3 reference meshes if not cached
        run: |
          if [ ! -f "$HOME/.cache/dorothy/ccf_2017/manifest.json" ]; then
            python -c "from guiai.gem.dorothy_data import fetch; fetch()"
          fi

      - name: Run Dorothy, Spatial, Continuum, Causal Chiasm, L3 Research, L4 Self-Improvement, L4 Multi-Module, Native Voice, L5 Phases 1-3, Eliza-GEM, and Spectral Theorem Tests
        run: |
          python scripts/zoe_groove_forensics.py --verify
          python scripts/verify_l3_research.py
          python scripts/verify_l4_self_improvement.py
          python scripts/verify_l4_multimodule.py
          python scripts/verify_zoe_voice.py
          python scripts/verify_l5_core.py
          python scripts/verify_l5_phase2.py
          python scripts/verify_zoe_eliza.py
          python scripts/verify_l5_phase3.py
          python scripts/verify_kloster_theorem13.py
          python scripts/verify_kloster_theorem14.py
          python scripts/verify_theorem15_and_c28.py
          python scripts/verify_kloster_theorem16.py
          python scripts/zoe_code_quality_audit.py
          python scripts/verify_metacognition_proof_packet.py
          python scripts/verify_renaissance_orbit.py
          python scripts/verify_zoe_clara.py
          python scripts/verify_shared_reasoning.py
          python scripts/verify_observatory_and_packages.py
          sha256sum -c evidence/renaissance-orbit/SHA256SUMS.orbit
          python -m unittest components/Zoe-Autonomy/tests/test_cross_domain_transfer.py components/Zoe-Autonomy/tests/test_spectral_filtration.py components/Zoe-Autonomy/tests/test_research_collaborator.py components/Zoe-Autonomy/tests/test_l4_self_improvement.py components/Zoe-Autonomy/tests/test_event_causal.py components/Zoe-Autonomy/tests/test_l4_multimodule.py components/Zoe-Autonomy/tests/test_zoe_voice.py components/Zoe-Autonomy/tests/test_l5_core.py components/Zoe-Autonomy/tests/test_l5_phase2.py components/Zoe-Autonomy/tests/test_zoe_eliza.py components/Zoe-Autonomy/tests/test_l5_phase3.py -v
          PYTHONPATH=components/Zoe-Autonomy/src:guiai-lab pytest components/Zoe-Autonomy/tests/test_sr_*.py -q
          cd components/agent-logging-system
          pytest tests/test_neurogarden_continuum.py tests/test_neurogarden_dorothy.py tests/test_neurogarden_spatial.py -v
