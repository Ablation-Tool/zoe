id: ACM-001
name: ai_attribution_file_header
version: "1.0"
category: content/code
model_family: Generic/LLM
confidence: high
description: Explicit AI attribution comment in source file header - tool left its signature
technique: AI-generated content
match_all: false
indicators:
  - type: regex
    pattern: '(?i)#\s*(this (file|code|script) was (generated|written|created) (by|with|using)|generated by|ai-generated|auto-generated by)'
  - type: regex
    pattern: '(?i)//\s*(generated by (claude|chatgpt|gpt-4|copilot|cursor|aider)|ai-generated code)'
  - type: regex
    pattern: '(?i)/\*\s*(generated by|ai-generated|written by (claude|chatgpt|gpt))'
tags: [attribution, file-header, code, generated]
---
id: ACM-002
name: ai_response_remnant_in_code
version: "1.0"
category: content/code
model_family: Generic/LLM
confidence: medium
description: AI assistant response prefix left in source code - pasted directly without cleanup
technique: AI-generated content
match_all: false
indicators:
  - type: regex
    pattern: "(?m)^#\\s*(Sure|Certainly|Of course|Absolutely)[!,]"
  - type: regex
    pattern: '(?m)^#\s*Here(''s| is) (the|a|an) (implementation|code|solution|function|class|script)'
  - type: regex
    pattern: "(?m)^//\\s*(Sure|Certainly|Of course)[!,]"
tags: [response-remnant, pasted-code, llm, content]
---
id: ACM-003
name: ai_model_config_comment
version: "1.0"
category: content/code
model_family: Generic/LLM
confidence: high
description: AI model configuration comment in source code or config - prompt/temperature spec left inline
technique: AI-generated content
match_all: false
indicators:
  - type: regex
    pattern: '(?i)#\s*model:\s*(gpt-4|claude|gemini|llama|mistral|deepseek)'
  - type: regex
    pattern: '(?i)#\s*temperature:\s*0\.\d+'
  - type: regex
    pattern: '(?i)#\s*prompt:\s*.{10,}'
  - type: regex
    pattern: '(?i)#\s*system prompt:'
tags: [model-config, prompt, temperature, code, config]
---
id: ACM-004
name: llm_api_key_comment
version: "1.0"
category: content/code
model_family: Generic/LLM
confidence: high
description: LLM API key placeholder or hardcoded key pattern in source code
technique: AI API usage
match_all: false
indicators:
  - type: regex
    pattern: 'sk-[A-Za-z0-9]{20,}'
  - type: regex
    pattern: 'sk-ant-[A-Za-z0-9-_]{20,}'
  - type: regex
    pattern: 'OPENAI_API_KEY\s*=\s*\S{10,}'
  - type: regex
    pattern: 'ANTHROPIC_API_KEY\s*=\s*\S{10,}'
tags: [api-key, credential, hardcoded, code, security]
---
id: ACM-005
name: ai_scaffold_placeholder
version: "1.0"
category: content/code
model_family: Generic/LLM
confidence: low
description: AI-generated scaffold placeholder comments left in code - TODO blocks with AI-characteristic phrasing
technique: AI-generated content
match_all: false
indicators:
  - type: regex
    pattern: '(?i)#\s*TODO:\s*(implement|add|replace) (this|the actual|with actual|error handling|logic)'
  - type: regex
    pattern: '(?i)#\s*Replace (this|the following) (with|placeholder) (your|actual|real)'
  - type: regex
    pattern: '(?i)#\s*(Note|Warning):\s*This (code|implementation) is (for educational|a placeholder|not production)'
tags: [scaffold, placeholder, todo, generated, content]
---
id: ACM-006
name: guardrails_ai_config
version: "1.0"
category: agentic/config
model_family: Guardrails/AI
confidence: high
description: Guardrails AI safety and validation framework configuration and import patterns
technique: AI framework deployment
match_all: false
indicators:
  - type: string
    pattern: 'from guardrails'
  - type: string
    pattern: 'import guardrails'
  - type: file_path
    pattern: '.guardrailsrc'
  - type: string
    pattern: 'guardrails hub'
tags: [guardrails, safety, validation, ai-safety, config]
