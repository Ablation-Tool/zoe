<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 36" width="114" height="36" role="img" aria-label="Sessions">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101b30"/>
      <stop offset="100%" stop-color="#181633"/>
    </linearGradient>
    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="112" height="34" rx="17" fill="url(#pillBg)" stroke="#62dce8" stroke-width="1.35" stroke-opacity="0.82"/>
  <rect x="3" y="3" width="108" height="30" rx="15" fill="none" stroke="#f4f0e8" stroke-width="0.5" stroke-opacity="0.14"/>
  <!-- Tiny faceted jewel diamond -->
  <polygon points="18,12 24,18 18,24 12,18" fill="#62dce8" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3.4s" repeatCount="indefinite"/>
  </polygon>
  <text x="66.0" y="22.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5" fill="#f4f0e8">Sessions</text>
</svg>
