[pytest]
testpaths = .
python_files = test_*.py
addopts = --tb=short -ra
markers =
    tier1: Tier 1 feature happy-path E2E tests across Areas A-I
    tier2: Tier 2 boundary, negative, and adversarial error-path E2E tests across Areas A-I
    tier3: Tier 3 pairwise cross-feature E2E combination tests (all 36 pairs A-I)
    tier4: Tier 4 real-world multi-step E2E domain workloads (W1-W6)
    m1_fix: Targets M1 unlanded fix contract (UMA path parity, ChatStore guard, ZoeAppBrain firewall, stem offline fallback)
    m2_fix: Targets M2 unlanded fix contract (semantic_artifacts._ablation_root, builder._ZOE_PY_CLOSURE zoe_sisters, static /os verify)
    m3_target: Targets M3 unlanded 3-Sister Council & Showcase Slice contract
    m4_target: Targets M4 unlanded ablation & reverse-engineering suite contract
