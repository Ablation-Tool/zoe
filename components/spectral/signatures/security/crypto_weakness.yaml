id: CRY-005
name: hardcoded_symmetric_key
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: medium
description: Hardcoded symmetric encryption key or initialization vector in AI service configuration or source code - exposes all ciphertext to any attacker with source access, and cannot be rotated without code change
technique: Hardcoded cryptographic key / fixed IV
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(AES|DES3|Fernet|ChaCha20)\.new\(b["\x27][a-zA-Z0-9/+]{16,64}["\x27]'
  - type: regex
    pattern: '(?i)(ENCRYPTION_KEY|AES_KEY|SYMMETRIC_KEY|SECRET_KEY)\s*=\s*["\x27][a-zA-Z0-9/+=]{16,64}["\x27]'
  - type: regex
    pattern: '(?i)key\s*=\s*b["\x27][a-zA-Z0-9!@#$%^&*]{16,64}["\x27]'
  - type: regex
    pattern: '(?i)(iv|nonce)\s*=\s*b["\x27][\\x0-9a-f]{16,64}["\x27]'
tags: [hardcoded-key, fixed-iv, aes-misuse, symmetric-encryption, key-management]
---
id: CRY-006
name: broken_cipher_in_ai_service
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: high
description: Broken or deprecated cipher (DES, RC4, ARC4, Blowfish) or MD5-HMAC used in AI service transport or token signing - these provide little to no security against modern attacks and should be replaced with AES-GCM or ChaCha20-Poly1305
technique: Broken cipher algorithm usage
match_all: false
indicators:
  - type: regex
    pattern: '(?i)from\s+(Crypto|cryptography)\S*\s+import\s+(DES|DES3|RC4|ARC4|Blowfish)'
  - type: regex
    pattern: '(?i)(DES|RC4|DES3|ARC4|Blowfish)\.new\('
  - type: regex
    pattern: '(?i)algorithm\s*=\s*["\x27](md5|sha1|des|rc4|blowfish)["\x27]'
  - type: regex
    pattern: '(?i)cipher\s*=\s*(RC4|DES|ARC4|Blowfish)\s*\('
tags: [des, rc4, blowfish, broken-cipher, deprecated-crypto, transport-security]
