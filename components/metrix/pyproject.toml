[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrix-re"
version = "0.1.0"
description = "Evidence-first inventory and navigation for reverse-engineering corpora"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = ["pyte>=0.8.1,<1"]

[project.scripts]
metrix = "metrix.cli:main"

[tool.setuptools.packages.find]
include = ["metrix*"]

[tool.setuptools.package-data]
metrix = ["templates/*.html", "gui/*.html", "gui/*.css", "gui/*.js"]
