name: package-and-regression
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .[dev]
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - run: python -m pip install --force-reinstall --no-deps --find-links dist availgate==0.2.0
      - run: python -m unittest discover -s tests -v
        env:
          AVAILGATE_TEST_INSTALLED: '1'
      - run: availgate capabilities --json
      - run: availgate doctor --json
