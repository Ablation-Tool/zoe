id: SHA-001
name: shadow_ai_personal_account_proxy_log
version: "1.0"
category: security/shadow-ai
model_family: Generic/ShadowAI
confidence: high
description: Employee personal AI account usage visible in proxy logs or network captures - unsanctioned AI interaction with enterprise data
technique: Shadow AI discovery
match_all: false
indicators:
  - type: regex
    pattern: 'CONNECT chat\.openai\.com:443'
  - type: regex
    pattern: 'CONNECT claude\.ai:443'
  - type: regex
    pattern: 'CONNECT gemini\.google\.com:443'
  - type: regex
    pattern: 'CONNECT (copilot|bing)\.microsoft\.com:443'
  - type: regex
    pattern: 'GET https?://chat\.openai\.com/api/'
tags: [shadow-ai, proxy, network, personal-account, unsanctioned]
---
id: SHA-002
name: shadow_ai_personal_api_key
version: "1.0"
category: security/shadow-ai
model_family: Generic/ShadowAI
confidence: high
description: Personal API key patterns indicating unsanctioned direct API access outside enterprise controls
technique: Shadow AI discovery
match_all: false
indicators:
  - type: regex
    pattern: 'sk-proj-[A-Za-z0-9_-]{40,}'
  - type: regex
    pattern: 'sk-[A-Za-z0-9]{48}'
  - type: regex
    pattern: 'ANTHROPIC_API_KEY\s*=\s*sk-ant-api'
  - type: regex
    pattern: 'OPENAI_API_KEY\s*=\s*sk-[A-Za-z0-9_-]{20,}'
tags: [shadow-ai, api-key, personal, unsanctioned, credential]
