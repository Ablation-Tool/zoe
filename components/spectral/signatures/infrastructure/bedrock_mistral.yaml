id: BED-001
name: amazon_bedrock_endpoint
version: "1.0"
category: infrastructure/headers
model_family: Amazon/Bedrock
confidence: high
description: Amazon Bedrock API endpoint and header patterns in HTTP logs or captured traffic
technique: AI API usage
match_all: false
indicators:
  - type: regex
    pattern: 'bedrock-runtime\.[a-z0-9-]+\.amazonaws\.com'
  - type: regex
    pattern: '/model/[a-z0-9.:/-]+/invoke((-with-response-stream)?)'
  - type: string
    pattern: 'X-Amzn-Bedrock'
  - type: regex
    pattern: 'anthropic\.claude|amazon\.titan|ai21\.j2|cohere\.command|meta\.llama'
tags: [amazon, bedrock, aws, api, headers, network]
