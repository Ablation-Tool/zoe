id: GGL-003
name: gemini_sdk_artifacts
version: "1.0"
category: agentic/config
model_family: Google/Gemini
confidence: medium
description: Google Gemini or Vertex AI SDK configuration and credential artifacts
technique: AI API usage
match_all: false
indicators:
  - type: file_path
    pattern: 'application_default_credentials.json'
  - type: regex
    pattern: '"type":\s*"service_account"'
  - type: string
    pattern: 'google.generativeai'
  - type: string
    pattern: 'vertexai.init'
tags: [google, gemini, vertex-ai, credentials, config]
