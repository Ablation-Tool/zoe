id: AID-002
name: aider_version_footer
version: "1.0"
category: code/commit
model_family: Aider/Generic
confidence: high
description: Aider version string in commit body - written by aider before commit
technique: AI-assisted code development
match_all: false
indicators:
  - type: regex
    pattern: 'aider v\d+\.\d+\.\d+'
  - type: regex
    pattern: '# aider chat started'
  - type: regex
    pattern: 'aider chat copy'
tags: [aider, commit, version, attribution]
