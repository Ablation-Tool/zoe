id: OAI-001
name: openai_codex_comment
version: "1.0"
category: code/comment
model_family: OpenAI/Codex
confidence: low
description: Comment patterns consistent with OpenAI Codex / ChatGPT code generation
technique: AI-assisted code development
match_all: false
indicators:
  - type: regex
    pattern: '#\s*This (code|function|script) was (generated|written|created) (by|with|using) (OpenAI|ChatGPT|GPT)'
  - type: regex
    pattern: '//\s*Generated by (ChatGPT|GPT-4|OpenAI|Codex)'
  - type: regex
    pattern: 'Powered by OpenAI'
tags: [openai, codex, chatgpt, code-generation]
