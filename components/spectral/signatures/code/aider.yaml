id: AID-001
name: aider_commit_attribution
version: "1.0"
category: code/commit
model_family: Aider/Generic
confidence: high
description: Commit footer attributed to aider (AI pair-programming tool)
technique: AI-assisted code development
match_all: false
indicators:
  - type: regex
    pattern: 'Co-authored-by: aider'
