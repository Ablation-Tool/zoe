[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "availgate"
version = "0.2.0"
description = "Multi-provider search and source reading for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "urllib3>=2,<3", "beautifulsoup4>=4.12,<5", "ddgs>=9,<10"]

[project.optional-dependencies]
display = ["rich>=13"]
semantic = ["numpy", "sentence-transformers"]
dev = ["build", "jsonschema>=4"]

[project.scripts]
availgate = "availgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
availgate = ["resources/*.md", "resources/*.json"]
