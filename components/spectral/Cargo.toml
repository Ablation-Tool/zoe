[package]
name        = "spectral"
version     = "0.9.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
authors     = ["Nicholas Kloster"]
description = "AI artifact scanner — detects indicators of AI/LLM activity in files, code, logs, and filesystems."
repository  = "https://github.com/francis-rancid/spectral"

[[bin]]
name = "spectral"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
rayon      = "1"
regex      = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir    = "2"

[profile.release]
opt-level     = 3
lto           = true
strip         = true
codegen-units = 1
