name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Python tests
        run: cd clients && python3 -m unittest test_safety_stream -v
      - name: Node tests
        run: node clients/js/safety-stream.test.js
      - name: Check emitter script
        run: bash -n emit.sh
