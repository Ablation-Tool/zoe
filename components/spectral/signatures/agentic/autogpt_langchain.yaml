id: AGT-010
name: autogpt_workspace_artifacts
version: "1.0"
category: agentic/filesystem
model_family: OpenAI/AutoGPT
confidence: high
description: AutoGPT workspace and session artifacts left on the filesystem
technique: Autonomous agent deployment
match_all: false
indicators:
  - type: file_path
    pattern: 'auto_gpt_workspace'
  - type: file_path
    pattern: '.autogpt'
  - type: file_path
    pattern: 'ai_settings.yaml'
  - type: file_path
    pattern: 'auto-gpt.json'
tags: [autogpt, openai, agent, filesystem]
