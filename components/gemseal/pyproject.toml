[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemseal"
version = "0.3.0"
description = "GEM-inspired authenticated-encryption containers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["cryptography>=41"]

[project.scripts]
gemseal = "gemseal:main"
gemseal-crack = "gemseal_crack:main"
gemseal-tripwire = "gemseal_tripwire:main"

[tool.setuptools]
py-modules = ["gemseal", "gemseal_crack", "gemseal_tripwire"]
