id: GGL-002
name: vertex_ai_headers
version: "1.0"
category: infrastructure/headers
model_family: Google/VertexAI
confidence: high
description: Google Vertex AI API endpoint and header patterns in HTTP logs or captured traffic
technique: AI API usage
match_all: false
indicators:
  - type: regex
    pattern: '[\w-]+\.aiplatform\.googleapis\.com'
  - type: regex
    pattern: '/v1/projects/[^/]+/locations/[^/]+/publishers/google/models/'
  - type: string
    pattern: 'x-goog-user-project:'
  - type: regex
    pattern: 'aiplatform\.googleapis\.com/v1beta1'
tags: [google, vertex-ai, api, headers, network]
