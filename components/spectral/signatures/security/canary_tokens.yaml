id: CNY-001
name: canarytoken_beacon_url
version: "1.0"
category: security/canary-token
model_family: Generic/Deception
confidence: high
description: Canarytokens.org beacon URL found in logs, configs, or AI pipeline artifacts - these fire HTTP callbacks when triggered, revealing unauthorized access or data exfiltration
technique: Canary token detection
match_all: false
indicators:
  - type: regex
    pattern: 'canarytokens\.org/[a-zA-Z0-9]{10,}'
  - type: regex
    pattern: 'https?://[a-z0-9]+\.canarytokens\.'
  - type: regex
    pattern: '(?i)(canarytoken|canary_token|honey_token)\s*[=:]\s*["\x27]?[a-zA-Z0-9]{8,}'
tags: [canary-token, deception, honeytoken, tripwire, data-theft-detection]
---
id: CNY-002
name: thinkst_canary_artifact
version: "1.0"
category: security/canary-token
model_family: Generic/Deception
confidence: high
description: Thinkst Canary token artifacts - DNS beacons, PDF tokens, or Word document canaries that signal unauthorized file access or dataset exfiltration from AI training pipelines
technique: Canary token detection / Thinkst Canary
match_all: false
indicators:
  - type: regex
    pattern: '(?i)[a-z0-9]{20,}\.canarytokens\.com'
  - type: regex
    pattern: '(?i)10_[a-z0-9]{16,}\.canarytokens\.'
  - type: file_path
    pattern: '*canary*.pdf'
  - type: file_path
    pattern: '*honeyfile*'
  - type: file_path
    pattern: '*honey_document*'
tags: [thinkst, canary, deception, data-theft-detection, pdf-token]
---
id: CNY-003
name: training_data_canary_phrase
version: "1.0"
category: security/canary-token
model_family: Generic/LLM
confidence: medium
description: Deliberately planted canary phrases in AI training data or RAG corpora designed to detect dataset theft through model extraction probing
technique: Training data canary / model extraction detection
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(canary|sentinel|tripwire)\s+(phrase|word|token|string|sequence)\s*[=:]\s*'
  - type: regex
    pattern: '(?i)training[_\s]?data[_\s]?canary'
  - type: regex
    pattern: '(?i)membership[_\s]?inference[_\s]?(attack|test|probe|canary)'
  - type: regex
    pattern: '(?i)data[_\s]?poisoning[_\s]?(detection|canary|tripwire)'
tags: [canary-phrase, training-data, model-extraction, membership-inference, data-theft]
---
id: CNY-004
name: honeypot_api_key_pattern
version: "1.0"
category: security/canary-token
model_family: Generic/Deception
confidence: medium
description: Deliberately patterned or explicitly named honeytoken API keys placed as tripwires to detect unauthorized access to AI infrastructure credentials
technique: Honeytoken API key
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(honey|canary|fake|trap|decoy)[_\-]?(api[_\-]?key|token|secret|credential)\s*[=:]'
  - type: regex
    pattern: '(?i)HONEYTOKEN[_\s]'
  - type: regex
    pattern: '(?i)api[_\-]?key.*#\s*(honeytoken|canary|trap|decoy|fake)'
  - type: regex
    pattern: '(?i)"note":\s*"(honeytoken|canary|tripwire|trap)"'
tags: [honeytoken, api-key, deception, tripwire, unauthorized-access]
---
id: CNY-005
name: honeyfile_filesystem_artifact
version: "1.0"
category: security/canary-token
model_family: Generic/Deception
confidence: medium
description: Filesystem artifacts from honeypot or honeyfile deployments used to detect unauthorized traversal of AI model stores, dataset directories, or configuration paths
technique: Honeyfile detection
match_all: false
indicators:
  - type: file_path
    pattern: '*/.honeypot*'
  - type: file_path
    pattern: '*/honeytrap*'
  - type: file_path
    pattern: '*/canary_file*'
  - type: regex
    pattern: '(?i)honeypot\s*=\s*(true|yes|1|enabled)'
  - type: regex
    pattern: '(?i)HONEYPOT_ENABLED|HONEY_FILE|CANARY_FILE'
tags: [honeyfile, filesystem, honeypot, deception, unauthorized-access]
---
id: CNY-006
name: ai_dataset_watermark
version: "1.0"
category: security/canary-token
model_family: Generic/LLM
confidence: medium
description: Dataset watermarking and model fingerprinting artifacts used to track unauthorized redistribution of AI training data or fine-tuned model weights
technique: Dataset watermarking / model fingerprinting
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(dataset|model)[_\s]?(watermark|fingerprint|provenance)[_\s]?(key|id|hash|token)\s*[=:]'
  - type: regex
    pattern: '(?i)radioactive[_\s]?data|backdoor[_\s]?watermark'
  - type: regex
    pattern: '(?i)model[_\s]?fingerprint[_\s]?(embed|inject|verify|check)'
  - type: regex
    pattern: '(?i)(GLAZED|Nightshade|Glaze)[_\s]?(poisoning|protection|artifact)'
tags: [watermark, fingerprint, dataset-provenance, model-theft, ip-protection]
