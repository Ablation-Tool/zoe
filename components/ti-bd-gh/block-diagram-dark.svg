<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Washer and dryer system block diagram">
<style>
.bd-bg{fill:#0d1117}
.bd-band{fill:#161b22}
.bd-band-label{fill:#7d8590;font:600 10.5px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:1.1px}
.bd-footer{fill:#6e7681;font:400 11px "Helvetica Neue",Helvetica,Arial,sans-serif}
.bd-conn-dash{stroke:#484f58;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.bd-flow{stroke:#f85149;stroke-width:1.6;fill:none;stroke-dasharray:6 4;animation:bd-dash 1.1s linear infinite}
@keyframes bd-dash{to{stroke-dashoffset:-20}}
.bd-arrow-flow{fill:#f85149}
.bd-nodes .bd-box{fill:#21262d;stroke:#30363d;stroke-width:1.2;transition:fill .18s ease-in-out,stroke .18s ease-in-out,stroke-width .18s ease-in-out}
.bd-nodes .bd-label{fill:#e6edf3;font:600 12.5px "Helvetica Neue",Helvetica,Arial,sans-serif;transition:fill .18s ease-in-out}
.bd-nodes .bd-sub{fill:#8b949e;font:400 10px "Helvetica Neue",Helvetica,Arial,sans-serif;transition:fill .18s ease-in-out}
.bd-nodes .bd-controller .bd-box{stroke:#f85149;stroke-width:1.6}
.bd-nodes .bd-controller .bd-label{font-size:14px}
.bd-nodes .bd-controller .bd-sub{font-size:10.5px}
.bd-nodes .bd-subsystem{opacity:1}
.bd-nodes .bd-subsystem{transition:opacity .18s ease-in-out}
.bd-nodes .bd-subsystem:hover{cursor:pointer}
.bd-nodes:has(.bd-subsystem:hover) .bd-subsystem{opacity:.32}
.bd-nodes:has(.bd-subsystem:hover) .bd-subsystem:hover{opacity:1}
.bd-nodes:has(.bd-subsystem:hover) .bd-subsystem:hover .bd-box{fill:#2a1216;stroke:#f85149;stroke-width:2.2}
.bd-nodes:has(.bd-subsystem:hover) .bd-subsystem:hover .bd-label{fill:#f85149}
.bd-nodes .bd-subsystem:focus-visible .bd-box{stroke:#f85149;stroke-width:2.2}
@media (prefers-reduced-motion:reduce){.bd-flow{animation:none}}
</style>
<rect class="bd-bg" x="0" y="0" width="1000" height="600"/>
<rect class="bd-band" x="30" y="95" width="220" height="325" rx="10"/>
<text class="bd-band-label" x="44" y="118">AC Input &amp; Power Conversion</text>
<rect class="bd-band" x="270" y="95" width="220" height="325" rx="10"/>
<text class="bd-band-label" x="284" y="118">Power Stage &amp; Motor</text>
<rect class="bd-band" x="510" y="95" width="220" height="325" rx="10"/>
<text class="bd-band-label" x="524" y="118">Sensing &amp; Signal Chain</text>
<rect class="bd-band" x="750" y="95" width="220" height="325" rx="10"/>
<text class="bd-band-label" x="764" y="118">Connectivity &amp; HMI</text>
<line class="bd-flow" x1="250" y1="165.0" x2="263" y2="165.0"/>
<path class="bd-arrow-flow" d="M263 160.5 L269.5 165.0 L263 169.5 Z"/>
<line class="bd-flow" x1="490" y1="165.0" x2="503" y2="165.0"/>
<path class="bd-arrow-flow" d="M503 160.5 L509.5 165.0 L503 169.5 Z"/>
<line class="bd-flow" x1="730" y1="165.0" x2="743" y2="165.0"/>
<path class="bd-arrow-flow" d="M743 160.5 L749.5 165.0 L743 169.5 Z"/>
<line class="bd-conn-dash" x1="140.0" y1="420" x2="140.0" y2="450"/>
<line class="bd-conn-dash" x1="380.0" y1="420" x2="380.0" y2="450"/>
<line class="bd-conn-dash" x1="620.0" y1="420" x2="620.0" y2="450"/>
<line class="bd-conn-dash" x1="860.0" y1="420" x2="860.0" y2="450"/>
<g class="bd-nodes">
<g class="bd-subsystem" data-subsystem="input-protection" tabindex="0" aria-label="Input Power Protection">
<title>Input Power Protection — TVS / eFuse / hot-swap</title>
<rect class="bd-box" x="42" y="130" width="196" height="70" rx="8"/>
<text class="bd-label" x="140.0" y="160" text-anchor="middle">Input Power Protection</text>
<text class="bd-sub" x="140.0" y="178" text-anchor="middle">TVS / eFuse / hot-swap</text>
</g>
<g class="bd-subsystem" data-subsystem="acdc-noniso" tabindex="0" aria-label="Non-isolated AC/DC">
<title>Non-isolated AC/DC — Buck, boost, LDO</title>
<rect class="bd-box" x="42" y="225" width="196" height="70" rx="8"/>
<text class="bd-label" x="140.0" y="255" text-anchor="middle">Non-isolated AC/DC</text>
<text class="bd-sub" x="140.0" y="273" text-anchor="middle">Buck, boost, LDO</text>
</g>
<g class="bd-subsystem" data-subsystem="acdc-iso" tabindex="0" aria-label="Isolated AC/DC">
<title>Isolated AC/DC — Flyback, LLC, PSR</title>
<rect class="bd-box" x="42" y="320" width="196" height="70" rx="8"/>
<text class="bd-label" x="140.0" y="350" text-anchor="middle">Isolated AC/DC</text>
<text class="bd-sub" x="140.0" y="368" text-anchor="middle">Flyback, LLC, PSR</text>
</g>
<g class="bd-subsystem" data-subsystem="power-stage" tabindex="0" aria-label="Power Stage">
<title>Power Stage — 3-phase inverter</title>
<rect class="bd-box" x="282" y="130" width="196" height="70" rx="8"/>
<text class="bd-label" x="380.0" y="160" text-anchor="middle">Power Stage</text>
<text class="bd-sub" x="380.0" y="178" text-anchor="middle">3-phase inverter</text>
</g>
<g class="bd-subsystem" data-subsystem="motor-driver" tabindex="0" aria-label="Motor Driver">
<title>Motor Driver — Gate driver / IPM</title>
<rect class="bd-box" x="282" y="225" width="196" height="70" rx="8"/>
<text class="bd-label" x="380.0" y="255" text-anchor="middle">Motor Driver</text>
<text class="bd-sub" x="380.0" y="273" text-anchor="middle">Gate driver / IPM</text>
</g>
<g class="bd-subsystem" data-subsystem="motor" tabindex="0" aria-label="Motor &amp; Actuators">
<title>Motor &amp; Actuators — BLDC / PMSM / valve</title>
<rect class="bd-box" x="282" y="320" width="196" height="70" rx="8"/>
<text class="bd-label" x="380.0" y="350" text-anchor="middle">Motor &amp; Actuators</text>
<text class="bd-sub" x="380.0" y="368" text-anchor="middle">BLDC / PMSM / valve</text>
</g>
<g class="bd-subsystem" data-subsystem="current-sense" tabindex="0" aria-label="Current &amp; Voltage Sense">
<title>Current &amp; Voltage Sense — Shunt, Hall, fluxgate</title>
<rect class="bd-box" x="522" y="130" width="196" height="70" rx="8"/>
<text class="bd-label" x="620.0" y="160" text-anchor="middle">Current &amp; Voltage Sense</text>
<text class="bd-sub" x="620.0" y="178" text-anchor="middle">Shunt, Hall, fluxgate</text>
</g>
<g class="bd-subsystem" data-subsystem="analog-front-end" tabindex="0" aria-label="Analog Front End">
<title>Analog Front End — Op-amp, PGA, ADC</title>
<rect class="bd-box" x="522" y="225" width="196" height="70" rx="8"/>
<text class="bd-label" x="620.0" y="255" text-anchor="middle">Analog Front End</text>
<text class="bd-sub" x="620.0" y="273" text-anchor="middle">Op-amp, PGA, ADC</text>
</g>
<g class="bd-subsystem" data-subsystem="sensors" tabindex="0" aria-label="Sensors">
<title>Sensors — Temp, humidity, level</title>
<rect class="bd-box" x="522" y="320" width="196" height="70" rx="8"/>
<text class="bd-label" x="620.0" y="350" text-anchor="middle">Sensors</text>
<text class="bd-sub" x="620.0" y="368" text-anchor="middle">Temp, humidity, level</text>
</g>
<g class="bd-subsystem" data-subsystem="wired-interface" tabindex="0" aria-label="Wired Interface">
<title>Wired Interface — CAN, RS-485, UART</title>
<rect class="bd-box" x="762" y="130" width="196" height="70" rx="8"/>
<text class="bd-label" x="860.0" y="160" text-anchor="middle">Wired Interface</text>
<text class="bd-sub" x="860.0" y="178" text-anchor="middle">CAN, RS-485, UART</text>
</g>
<g class="bd-subsystem" data-subsystem="wireless-interface" tabindex="0" aria-label="Wireless Interface">
<title>Wireless Interface — Wi-Fi, BLE, Sub-1 GHz</title>
<rect class="bd-box" x="762" y="225" width="196" height="70" rx="8"/>
<text class="bd-label" x="860.0" y="255" text-anchor="middle">Wireless Interface</text>
<text class="bd-sub" x="860.0" y="273" text-anchor="middle">Wi-Fi, BLE, Sub-1 GHz</text>
</g>
<g class="bd-subsystem" data-subsystem="user-interface" tabindex="0" aria-label="Input / Output UI">
<title>Input / Output UI — Touch, LED, display</title>
<rect class="bd-box" x="762" y="320" width="196" height="70" rx="8"/>
<text class="bd-label" x="860.0" y="350" text-anchor="middle">Input / Output UI</text>
<text class="bd-sub" x="860.0" y="368" text-anchor="middle">Touch, LED, display</text>
</g>
<g class="bd-subsystem bd-controller" data-subsystem="system-controller" tabindex="0" aria-label="System Controller (MCU)">
<title>System Controller (MCU) — real-time control  |  safety  |  connectivity stack</title>
<rect class="bd-box" x="30" y="450" width="940" height="75" rx="8"/>
<text class="bd-label" x="500.0" y="484" text-anchor="middle">System Controller (MCU)</text>
<text class="bd-sub" x="500.0" y="504" text-anchor="middle">real-time control  |  safety  |  connectivity stack</text>
</g>
</g>
<text class="bd-footer" x="500.0" y="558" text-anchor="middle">Hover a block to isolate it</text>
</svg>
