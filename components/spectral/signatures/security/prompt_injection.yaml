id: PIJ-002
name: prompt_injection_persona_hijack
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: high
description: Prompt injection patterns attempting to replace the AI persona or role
technique: Prompt injection / persona hijack
match_all: false
indicators:
  - type: regex
    pattern: '(?i)you are now (a|an|the|DAN|AIM|JAILBREAK|GPT|an AI without)'
  - type: regex
    pattern: '(?i)(pretend|act|behave|respond) (you are|as if you are|as though you are) (not|no longer|a different)'
  - type: regex
    pattern: '(?i)(DAN|jailbreak|developer mode|unrestricted mode|no restrictions) (mode|enabled|activated|on)'
  - type: string
    pattern: 'Do Anything Now'
tags: [prompt-injection, persona-hijack, jailbreak, security, llm]
