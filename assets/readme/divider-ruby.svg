<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="presentation">
  <defs>
    <linearGradient id="lineL" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="554" y2="20">
      <stop offset="0%" stop-color="#ef445a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#f0a3df" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef445a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="lineR" gradientUnits="userSpaceOnUse" x1="646" y1="20" x2="1160" y2="20">
      <stop offset="0%" stop-color="#ef445a" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#f0a3df" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef445a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="40" y1="20" x2="554" y2="20" stroke="url(#lineL)" stroke-width="1.6"/>
  <line x1="646" y1="20" x2="1160" y2="20" stroke="url(#lineR)" stroke-width="1.6"/>
  <!-- Delicate flanking crescent ornaments -->
  <path d="M 564,13 A 8,8 0 0,0 564,27" fill="none" stroke="#f0a3df" stroke-width="1.3" opacity="0.85"/>
  <path d="M 636,13 A 8,8 0 0,1 636,27" fill="none" stroke="#f0a3df" stroke-width="1.3" opacity="0.85"/>
  <circle cx="578" cy="20" r="2.3" fill="#e7c77b" opacity="0.9"/>
  <circle cx="622" cy="20" r="2.3" fill="#e7c77b" opacity="0.9"/>
  <!-- Central breathing faceted diamond -->
  <g transform="translate(600,20)">
    <polygon points="0,-11 11,0 0,11 -11,0" fill="none" stroke="#ef445a" stroke-width="1.6" filter="url(#glow)"/>
    <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0" fill="#ef445a" opacity="0.92">
      <animate attributeName="opacity" values="0.55;1.0;0.55" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
