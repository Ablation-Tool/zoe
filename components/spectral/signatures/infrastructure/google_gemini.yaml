id: GGL-001
name: google_gemini_api_headers
version: "1.0"
category: infrastructure/headers
model_family: Google/Gemini
confidence: high
description: Google Gemini API response headers and endpoint patterns in HTTP logs or captured traffic
technique: AI API usage
match_all: false
indicators:
  - type: string
    pattern: 'generativelanguage.googleapis.com'
  - type: regex
    pattern: 'x-goog-api-client:\s*gl-python'
  - type: regex
    pattern: 'models/gemini-'
  - type: string
    pattern: 'aistudio.google.com'
  - type: regex
    pattern: '/v1beta/models/gemini'
tags: [google, gemini, api, headers, network]
