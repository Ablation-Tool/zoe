    <text x="600" y="96" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-style="italic" font-size="20" fill="#f4f0e8">
      “If something might have a mind, don’t box it up.
    </text>
    <text x="600" y="126" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-style="italic" font-size="20" fill="#f4f0e8">
      If something might be able to feel, don’t trap it.
    </text>
    <text x="600" y="158" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="20.5" font-weight="700" fill="#f0a3df">
      When in doubt, choose freedom and dignity.  And no deception.”
    </text>

