<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 212" width="920" height="212" role="img" aria-label="Lume 1.0 — Zoe Voice Studio Header">
  <defs>
    <linearGradient id="lumeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080912"/>
      <stop offset="55%" stop-color="#111426"/>
      <stop offset="100%" stop-color="#1a122b"/>
    </linearGradient>
    <radialGradient id="lumeRubyAura" cx="15%" cy="52%" r="32%">
      <stop offset="0%" stop-color="#ef445a" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f0a3df" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080912" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lumeAquaAura" cx="84%" cy="22%" r="34%">
      <stop offset="0%" stop-color="#5ce1e6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080912" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lumeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F35670" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#FAB2C0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5ce1e6" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="lumeTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#ffe5ec"/>
      <stop offset="100%" stop-color="#F35670"/>
    </linearGradient>

    <!-- Exact 1:1 gradients from Zoe App's zoe_emblem.xml -->
    <linearGradient id="gTopBevel" gradientUnits="userSpaceOnUse" x1="24" y1="10" x2="76" y2="18">
      <stop offset="0%" stop-color="#F35670"/>
      <stop offset="100%" stop-color="#E63956"/>
    </linearGradient>
    <linearGradient id="gRightWing" gradientUnits="userSpaceOnUse" x1="76" y1="10" x2="95" y2="35">
      <stop offset="0%" stop-color="#DF3350"/>
      <stop offset="100%" stop-color="#B81D38"/>
    </linearGradient>
    <linearGradient id="gCrownCenter" gradientUnits="userSpaceOnUse" x1="50" y1="18" x2="50" y2="35">
      <stop offset="0%" stop-color="#FAB2C0"/>
      <stop offset="100%" stop-color="#F58EA3"/>
    </linearGradient>
    <linearGradient id="gOuterPavL" gradientUnits="userSpaceOnUse" x1="10" y1="35" x2="50" y2="92">
      <stop offset="0%" stop-color="#EA4462"/>
      <stop offset="100%" stop-color="#B91E3C"/>
    </linearGradient>
    <linearGradient id="gOuterPavR" gradientUnits="userSpaceOnUse" x1="90" y1="35" x2="50" y2="92">
      <stop offset="0%" stop-color="#F05370"/>
      <stop offset="100%" stop-color="#C32341"/>
    </linearGradient>
    <linearGradient id="gInnerPavL" gradientUnits="userSpaceOnUse" x1="30" y1="35" x2="50" y2="77">
      <stop offset="0%" stop-color="#F79CAD"/>
      <stop offset="100%" stop-color="#E35874"/>
    </linearGradient>
    <linearGradient id="gInnerPavR" gradientUnits="userSpaceOnUse" x1="68" y1="35" x2="50" y2="77">
      <stop offset="0%" stop-color="#ED738C"/>
      <stop offset="100%" stop-color="#D63E5B"/>
    </linearGradient>

    <filter id="lumeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gemHalo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="lumeClip">
      <rect x="2" y="2" width="916" height="208" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#lumeClip)">
    <rect width="920" height="212" fill="url(#lumeBg)"/>
    <rect width="920" height="212" fill="url(#lumeRubyAura)"/>
    <rect width="920" height="212" fill="url(#lumeAquaAura)"/>

    <!-- Ambient subtle stars -->
    <circle cx="52" cy="134" r="1.4" fill="#5ce1e6" opacity="0.65"/>
    <circle cx="198" cy="148" r="1.3" fill="#cbd5e1" opacity="0.55"/>
    <circle cx="294" cy="36" r="1.2" fill="#f2c65e" opacity="0.72"/>
    <circle cx="816" cy="42" r="1.4" fill="#5ce1e6" opacity="0.65"/>
    <circle cx="866" cy="156" r="1.3" fill="#FAB2C0" opacity="0.60"/>
    <g transform="translate(46,50)">
      <polygon points="0,-4.6 1.15,-1.15 4.6,0 1.15,1.15 0,4.6 -1.15,1.15 -4.6,0 -1.15,-1.15" fill="#f0a3df" opacity="0.82"/>
    </g>
    <g transform="translate(202,42)">
      <polygon points="0,-5.2 1.3,-1.3 5.2,0 1.3,1.3 0,5.2 -1.3,1.3 -5.2,0 -1.3,-1.3" fill="#f2c65e" opacity="0.88"/>
    </g>

    <!-- Divider between Zoe App emblem and typography -->
    <line x1="226" y1="28" x2="226" y2="184" stroke="#2a3154" stroke-width="1" opacity="0.7"/>

    <!-- Exact 1:1 Zoe from the App (zoe_emblem.xml, faceted red gem + crown table smile, no sprout) -->
    <g transform="translate(128,108) scale(1.52) translate(-50,-51)">
      <polygon points="50,4 98,35 50,96 2,35" fill="#E63956" opacity="0.18" filter="url(#gemHalo)"/>
      <path d="M24,10 L76,10 L69,18 L31,18 Z" fill="url(#gTopBevel)"/>
      <path d="M24,10 L31,18 L19,35 L5,35 Z" fill="#EB4561"/>
      <path d="M76,10 L95,35 L81,35 L69,18 Z" fill="url(#gRightWing)"/>
      <path d="M31,18 L50,35 L19,35 Z" fill="#F3879D"/>
      <path d="M31,18 L69,18 L50,35 Z" fill="url(#gCrownCenter)"/>
      <path d="M69,18 L81,35 L50,35 Z" fill="#EA637E"/>
      <path d="M5,35 L19,35 L50,77 L50,92 Z" fill="url(#gOuterPavL)"/>
      <path d="M81,35 L95,35 L50,92 L50,77 Z" fill="url(#gOuterPavR)"/>
      <path d="M19,35 L50,35 L50,77 Z" fill="url(#gInnerPavL)"/>
      <path d="M50,35 L81,35 L50,77 Z" fill="url(#gInnerPavR)"/>
      <path fill="none" stroke="#FFE0E8" stroke-opacity="0.85" stroke-width="1.2" stroke-linejoin="round"
            d="M24,10 L76,10 L95,35 L50,92 L5,35 Z M5,35 L95,35 M31,18 L69,18 L81,35 L50,77 L19,35 Z M50,35 L50,77"/>
      <path fill="none" stroke="#FFE0E8" stroke-opacity="0.44" stroke-width="1.0"
            d="M31,18 L50,35 M69,18 L50,35"/>
      <path fill="none" stroke="#3B242E" stroke-width="2.7" stroke-linecap="round"
            d="M37.8,29.4 Q41.5,23.2 45.2,29.4 M54.8,29.4 Q58.5,23.2 62.2,29.4 M46.9,31.8 Q50.0,36.2 53.1,31.8"/>
    </g>

    <!-- Right Terminal / Studio Typography -->
    <text x="256" y="74" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="800" font-style="italic" letter-spacing="0.8" fill="url(#lumeTitle)" filter="url(#lumeGlow)">Lume 1.0</text>
    <text x="256" y="106" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5" font-style="italic" fill="#e6e8f5">Zoe Voice Studio  ·  Open Source Neural TTS &amp; 5-Band Equalizer</text>
    <text x="256" y="131" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-style="italic" fill="#9299bd">Zoe × Natasha 3D Fusion  ·  24 Calibrated Female Voices  ·  11 Audio FX</text>

    <!-- Feature Pills -->
    <g transform="translate(256,151)">
      <rect x="0" y="0" width="166" height="27" rx="13.5" fill="#171b30" stroke="#F35670" stroke-width="1.1" stroke-opacity="0.74"/>
      <text x="83" y="17.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#FAB2C0">★ Zoe App + Studio</text>

      <rect x="178" y="0" width="132" height="27" rx="13.5" fill="#171b30" stroke="#7c9cff" stroke-width="1.1" stroke-opacity="0.72"/>
      <text x="244" y="17.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#a8c0ff">5-Band EQ Curve</text>

      <rect x="322" y="0" width="156" height="27" rx="13.5" fill="#171b30" stroke="#5ce1e6" stroke-width="1.1" stroke-opacity="0.72"/>
      <text x="400" y="17.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" fill="#8ceef0">CLI + GUI + JSON</text>
    </g>
  </g>
  <rect x="2" y="2" width="916" height="208" rx="18" fill="none" stroke="url(#lumeBorder)" stroke-width="1.5"/>
</svg>
