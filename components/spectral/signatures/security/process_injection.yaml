id: PRC-001
name: dll_injection_api_sequence
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: high
description: DLL injection API call sequence in scripts or artifacts on a Windows AI infrastructure host - VirtualAllocEx plus WriteProcessMemory plus CreateRemoteThread is the canonical pattern for loading attacker DLLs into running model serving processes
technique: DLL injection / remote thread injection
match_all: false
indicators:
  - type: regex
    pattern: 'CreateRemoteThread.{0,300}WriteProcessMemory'
  - type: regex
    pattern: 'VirtualAllocEx.{0,300}WriteProcessMemory'
  - type: regex
    pattern: '(?i)(VirtualAllocEx|WriteProcessMemory|CreateRemoteThread).{0,100}LoadLibrary'
  - type: regex
    pattern: '(?i)OpenProcess.{0,60}PROCESS_ALL_ACCESS.{0,200}WriteProcessMemory'
tags: [dll-injection, createremotethread, virtualAllocEx, process-injection, windows-malware]
---
id: PRC-002
name: process_hollowing_markers
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: high
description: Process hollowing API markers in Windows AI host artifacts - attacker creates a legitimate process suspended, unmaps its memory, replaces it with malicious code, and resumes execution, effectively disguising malware as svchost.exe or other trusted processes
technique: Process hollowing / process replacement
match_all: false
indicators:
  - type: regex
    pattern: 'NtUnmapViewOfSection.{0,400}(WriteProcessMemory|CREATE_SUSPENDED)'
  - type: regex
    pattern: 'CREATE_SUSPENDED.{0,400}NtUnmapViewOfSection'
  - type: regex
    pattern: '(?i)(process.{0,10}replac|process.{0,10}hollow).{0,100}(NtUnmapView|GetThreadContext|SetThreadContext)'
  - type: regex
    pattern: '(?i)(GetThreadContext|SetThreadContext).{0,200}(ResumeThread|NtResumeThread).{0,200}(inject|hollow|replac)'
tags: [process-hollowing, NtUnmapViewOfSection, process-replacement, windows-malware, stealth-launch]
---
id: PRC-003
name: apc_injection_pattern
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: high
description: Asynchronous Procedure Call injection pattern in Windows AI host code or artifacts - QueueUserAPC with LoadLibraryA forces target threads in alertable states (svchost.exe is a common target) to load attacker DLLs without creating new threads
technique: APC injection / asynchronous procedure call abuse
match_all: false
indicators:
  - type: regex
    pattern: 'QueueUserAPC.{0,200}LoadLibrary'
  - type: regex
    pattern: 'KeInitializeApc.{0,400}KeInsertQueueApc'
  - type: regex
    pattern: '(?i)QueueUserAPC.{0,200}svchost'
  - type: regex
    pattern: '(?i)(OpenThread.{0,100}QueueUserAPC|QueueUserAPC.{0,100}alertable)'
tags: [apc-injection, QueueUserAPC, KeInitializeApc, alertable-thread, windows-malware]
---
id: PRC-004
name: ssdt_hook_artifact
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: high
description: System Service Descriptor Table (SSDT) hook indicators in Windows AI host kernel artifacts - rootkits modify SSDT entries to intercept NtCreateFile and other syscalls, hiding malicious files and processes from AI infrastructure monitoring tools
technique: SSDT hooking / kernel rootkit
match_all: false
indicators:
  - type: regex
    pattern: 'KeServiceDescriptorTable'
  - type: regex
    pattern: '(?i)(SSDT|KeServiceDescriptorTable).{0,80}(hook|patch|overwrite|modify|inject)'
  - type: regex
    pattern: 'MmGetSystemRoutineAddress.{0,300}KeServiceDescriptorTable'
  - type: regex
    pattern: '(?i)(NtCreateFile|NtOpenFile|NtQueryDirectoryFile).{0,60}(hook|hijack|replace|intercept)'
tags: [ssdt, kernel-rootkit, KeServiceDescriptorTable, syscall-hook, windows-rootkit]
---
id: PRC-005
name: svchost_process_targeting
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: medium
description: Malware targeting svchost.exe or lsass.exe processes for injection in Windows AI infrastructure scripts or artifacts - these processes are popular injection targets because their threads are often in alertable states and they run with elevated privileges
technique: Privileged process injection targeting
match_all: false
indicators:
  - type: regex
    pattern: '(?i)OpenProcess.{0,60}svchost\.exe'
  - type: regex
    pattern: '(?i)CreateToolhelp32Snapshot.{0,400}svchost\.exe.{0,200}OpenProcess'
  - type: regex
    pattern: '(?i)Process32(First|Next).{0,200}(svchost|lsass|explorer)\.exe.{0,200}OpenProcess'
  - type: regex
    pattern: '(?i)(target|inject).{0,20}process.{0,40}(svchost|lsass).{0,40}(APC|thread|remote)'
tags: [svchost-targeting, process-injection, lsass, windows-malware, elevated-process]
---
id: PRC-006
name: xor_encoding_routine
version: "1.0"
category: security/process-injection
model_family: Generic/Malware
confidence: medium
description: XOR obfuscation loop patterns in scripts or code on AI infrastructure hosts - single-byte XOR is the most common encoding technique used by malware staging payloads to evade static detection before injecting into AI processes or model servers
technique: XOR payload encoding / obfuscation
match_all: false
indicators:
  - type: regex
    pattern: '(?i)for\s+[a-z]\s+in\s+range\(len\([a-z_]+\)\).{0,20}[a-z_]+\[.+\]\s*\^=\s*(0x[0-9a-f]{1,2}|[a-z_]+)'
  - type: regex
    pattern: '(?i)(xor_key|xor_encode|xor_decode)\s*=?\s*(0x[0-9a-f]{2}|[0-9]{1,3})\b'
  - type: regex
    pattern: '(?i)payload\s*=\s*bytes\(\[b\s*\^\s*(0x[0-9a-f]{2}|key)\s+for\s+b\s+in'
  - type: regex
    pattern: '(?i)(shellcode|payload|buf).{0,30}\^\s*(0x[0-9a-f]{2}|key\[[a-z]\])'
tags: [xor-encoding, obfuscation, shellcode, payload-encoding, evasion]
