id: CRY-001
name: insecure_rng_for_crypto
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: high
description: Non-cryptographic random number generator used for key, token, or nonce generation in AI service code - vulnerable to state prediction and cloning attacks as documented in LCG and Mersenne Twister analysis
technique: Weak RNG for cryptographic material
match_all: false
indicators:
  - type: regex
    pattern: '(?i)random\.(randint|choice|sample|random|getrandbits)\(.{0,60}(key|token|secret|nonce|iv|salt|password)'
  - type: regex
    pattern: '(?i)(api_?key|secret|token|nonce|session_?id)\s*=\s*str\(random\.(random|randint|getrandbits)\('
  - type: regex
    pattern: '(?i)(key|secret|token)\s*=\s*random\.(randint|choice|getrandbits)\('
  - type: regex
    pattern: '"math/rand".{0,500}(key|secret|token|nonce|hmac|aes|rsa|ecdsa)'
tags: [weak-rng, lcg, mersenne-twister, crypto-weakness, key-generation]
---
id: CRY-002
name: weak_hash_for_auth
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: high
description: MD5 or SHA-1 used directly for password hashing, API token generation, or authentication in AI infrastructure code - these produce rainbow-table-crackable digests without salting
technique: Weak hash algorithm in authentication context
match_all: false
indicators:
  - type: regex
    pattern: '(?i)hashlib\.md5\(.{0,80}(password|passwd|secret|token|api.?key|auth)'
  - type: regex
    pattern: '(?i)hashlib\.sha1\(.{0,80}(password|passwd|secret|token|api.?key|auth)'
  - type: regex
    pattern: '(?i)md5\(.{0,60}(password|secret|token|key)\)\.hexdigest\(\)'
  - type: regex
    pattern: '(?i)(PASSWORD_HASH|AUTH_HASH)\s*=\s*hashlib\.(md5|sha1)\('
tags: [md5, sha1, weak-hash, password-hashing, rainbow-table]
---
id: CRY-003
name: secret_prefix_mac_length_extension
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: high
description: Secret-prefix MAC pattern in AI service authentication code - vulnerable to Merkle-Damgard length extension attacks allowing token forgery without knowing the secret key, as demonstrated against SHA-256 and SHA-512 prefix constructions
technique: Secret-prefix MAC / length extension vulnerability
match_all: false
indicators:
  - type: regex
    pattern: '(?i)hashlib\.(sha256|sha512|sha1|md5)\(\s*(secret|key|api_?key)\s*\+'
  - type: regex
    pattern: '(?i)hashlib\.(sha256|sha512|sha1|md5)\(\s*[a-z_]+\s*\+\s*(data|message|payload|body|request)'
  - type: regex
    pattern: '(?i)(mac|hmac|tag)\s*=\s*hashlib\.(sha256|sha1|md5)\([^)]{0,40}\+[^)]{0,40}\)\.hexdigest\(\)'
  - type: regex
    pattern: '(?i)digest\s*=\s*hashlib\.(sha|md5).{0,60}secret\s*\+\s*'
tags: [length-extension, secret-prefix-mac, sha256, hmac-misuse, token-forgery]
---
id: CRY-004
name: ecdsa_nonce_reuse_risk
version: "1.0"
category: security/crypto-weakness
model_family: Generic/AIService
confidence: medium
description: ECDSA signing with a fixed or non-random nonce in AI service signing code - reusing k even once leaks the private key, as exploited against PlayStation 3 firmware signing and Bitcoin wallets
technique: ECDSA fixed nonce / nonce reuse
match_all: false
indicators:
  - type: regex
    pattern: '(?i)ecdsa.{0,100}(k\s*=\s*1\b|nonce\s*=\s*1\b|k\s*=\s*0x0+[0-9a-f]{1,8}\b)'
  - type: regex
    pattern: '(?i)(k\s*=\s*1|fixed.{0,10}nonce|static.{0,10}nonce).{0,60}(ecdsa|sign|signature)'
  - type: regex
    pattern: '(?i)ecdsa.{0,200}random\.(randint|getrandbits).{0,30}nonce'
  - type: regex
    pattern: '(?i)nonce\s*=\s*random\.randint\(1.{0,20}\).{0,60}(sign|ecdsa|curve)'
tags: [ecdsa, nonce-reuse, private-key-recovery, elliptic-curve, ps3-hack]
