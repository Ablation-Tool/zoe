<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 38" width="326" height="38" role="img" aria-label="Open Live in Web Browser · No Download">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101b30"/>
      <stop offset="100%" stop-color="#181633"/>
    </linearGradient>
    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="324" height="36" rx="18" fill="url(#pillBg)" stroke="#e7c77b" stroke-width="1.5" stroke-opacity="0.92"/>
  <rect x="3" y="3" width="320" height="32" rx="17" fill="none" stroke="#f4f0e8" stroke-width="0.5" stroke-opacity="0.14"/>
  <polygon points="18,13.0 24,19.0 18,25.0 12,19.0" fill="#e7c77b" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="3.4s" repeatCount="indefinite"/>
  </polygon>
  <text x="173.0" y="23.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.45" fill="#f4f0e8">Open Live in Web Browser · No Download</text>
</svg>
