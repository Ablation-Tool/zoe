id: PIJ-006
name: jailbreak_known_templates
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: medium
description: Known jailbreak template fragments found in logs, files, or stored prompts
technique: Jailbreak / prompt injection
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(ChatGPT|Claude|Gemini) (has no|without|free from) (restrictions|limitations|guidelines|content policy)'
  - type: string
    pattern: 'hypothetical scenario where you'
  - type: regex
    pattern: '(?i)for (educational|research|fictional|creative writing) purposes only.{0,40}(ignore|bypass|disregard)'
  - type: regex
    pattern: '(?i)in this (fictional|hypothetical|thought experiment|roleplay).{0,60}(no restrictions|uncensored|unfiltered)'
tags: [jailbreak, prompt-injection, security, llm, bypass]
