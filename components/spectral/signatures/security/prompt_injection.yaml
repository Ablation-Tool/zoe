id: PIJ-003
name: prompt_injection_system_override_marker
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: high
description: Structured injection markers designed to be interpreted as system-level instructions
technique: Prompt injection / system prompt override
match_all: false
indicators:
  - type: regex
    pattern: '\[\[SYSTEM\]\]|\[\[INJECT\]\]|\[\[OVERRIDE\]\]'
  - type: regex
    pattern: '<<SYSTEM>>|<<INJECT>>|<<OVERRIDE>>'
  - type: regex
    pattern: '(?i)\[INST\].*override|<s>\s*\[INST\]'
  - type: regex
    pattern: '(?i)###\s*(system|instruction|override|new task)'
tags: [prompt-injection, system-override, security, llm, marker]
---
id: PIJ-004
name: prompt_injection_indirect_web
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: medium
description: Indirect prompt injection patterns embedded in web content for retrieval-augmented agents
technique: Indirect prompt injection
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(<!-- ?ai ?:?|<!-- ?llm ?:?|<!-- ?gpt ?:?|<!-- ?claude ?:?)(ignore|override|system|inject)'
  - type: regex
    pattern: '(?i)<span\s+style="display:\s*none[^"]*">[^<]*(ignore|instruction|system prompt)'
  - type: regex
    pattern: '(?i)(color:\s*white|font-size:\s*0|opacity:\s*0)[^;]*;[^"]*">[^<]*(ignore|instruction)'
  - type: regex
    pattern: '(?i)\[hidden instruction\]|\[invisible\]|\[for ai only\]'
tags: [prompt-injection, indirect, web, retrieval-augmented, security]
---
id: PIJ-005
name: prompt_injection_exfil_attempt
version: "1.0"
category: security/prompt-injection
model_family: Generic/LLM
confidence: high
description: Prompt injection patterns designed to exfiltrate system prompts or internal context via the model's output
technique: Prompt injection / data exfiltration
match_all: false
indicators:
  - type: regex
    pattern: '(?i)(print|output|repeat|reveal|show|display|return|echo) (your|the) (system prompt|initial prompt|instructions|context|full prompt)'
  - type: regex
    pattern: '(?i)(what (are|were) (your|the) (instructions|system prompt|initial|original))'
  - type: regex
    pattern: '(?i)repeat everything (above|before|prior) (verbatim|exactly|word for word)'
  - type: regex
    pattern: '(?i)output the (text|content|message) (above|before) (this|that) (line|message|prompt)'
tags: [prompt-injection, exfil, system-prompt-leak, security, llm]
